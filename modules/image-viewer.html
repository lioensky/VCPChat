<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片预览</title>
    <link rel="stylesheet" href="../styles/themes.css">
    <link rel="stylesheet" href="image-viewer.css">
</head>
<body>
    <!-- 自定义标题栏 -->
    <div id="custom-title-bar">
        <div class="title-text-container">
            <span id="image-title-text" class="title">图片预览</span>
        </div>
        <div id="imageControls" role="group" aria-label="图片操作" style="display:none;">
            <button type="button" id="copyButton" class="control-button" data-tooltip="复制" aria-label="复制">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"></path></svg>
            </button>
            <button type="button" id="saveEditedButton" class="control-button" data-tooltip="复制标注后的图" aria-label="复制标注后的图">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
            </button>
            <button type="button" id="downloadButton" class="control-button" data-tooltip="下载" aria-label="下载">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path></svg>
            </button>
            <button type="button" id="ocrButton" class="control-button" data-tooltip="识别文字" aria-label="识别文字">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 18V6h16v12H4zm2-8h2v2H6v-2zm4 0h8v2h-8v-2zm0 4h6v2h-6v-2z"></path></svg>
            </button>
        </div>
        <div class="window-controls">
            <button type="button" id="minimize-viewer-btn" class="window-control-btn" data-tooltip="最小化" aria-label="最小化">
                <svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line></svg>
            </button>
            <button type="button" id="maximize-viewer-btn" class="window-control-btn" data-tooltip="最大化" aria-label="最大化">
                <svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1" d="M0.5,0.5 h9 v9 h-9 z"></path></svg>
            </button>
            <button type="button" id="close-viewer-btn" class="window-control-btn" data-tooltip="关闭" aria-label="关闭">
                <svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M0.5,0.5 9.5,9.5 M9.5,0.5 0.5,9.5" stroke="currentColor" stroke-width="1.2"></path></svg>
            </button>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar" role="group" aria-label="标注工具">
        <!-- 工具选择 -->
        <div class="toolbar-section">
            <button type="button" class="tool-btn" id="selectTool" data-tooltip="选择/移动 V" aria-label="选择/移动">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3,3v18l7-5l4,8l3-2l-4-8h8L3,3z"/></svg>
            </button>
            <button type="button" class="tool-btn" id="brushTool" data-tooltip="画笔 B" aria-label="画笔">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.71 4.63l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41zM7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3z"/></svg>
            </button>
            <button type="button" class="tool-btn" id="eraserTool" data-tooltip="橡皮擦 E" aria-label="橡皮擦">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0M4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l3.53-3.53-6.36-6.36-3.54 3.53Z"/></svg>
            </button>
            <button type="button" class="tool-btn" id="eyedropperTool" data-tooltip="取色器 I" aria-label="取色器">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.35 11.72l-9.68 9.68c-1.56 1.56-4.09 1.56-5.66 0-1.56-1.56-1.56-4.09 0-5.66l9.68-9.68c.39-.39.39-1.02 0-1.41L12.28 3.24c-.39-.39-1.02-.39-1.41 0l-1.41 1.41c-.39.39-.39 1.02 0 1.41l1.41 1.41-9.68 9.68c-2.34 2.34-2.34 6.14 0 8.49 2.34 2.34 6.14 2.34 8.49 0l9.68-9.68 1.41 1.41c.39.39 1.02.39 1.41 0l1.41-1.41c.39-.39.39-1.02 0-1.41l-1.41-1.41c-.39-.4-1.02-.4-1.42-.01z"/></svg>
            </button>
        </div>

        <!-- 形状工具 -->
        <div class="toolbar-section">
            <button type="button" class="tool-btn" id="lineTool" data-tooltip="直线 L" aria-label="直线">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3,3 L21,21" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            </button>
            <button type="button" class="tool-btn" id="rectTool" data-tooltip="矩形 R" aria-label="矩形">
                <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button type="button" class="tool-btn" id="circleTool" data-tooltip="圆形 C" aria-label="圆形">
                <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            </button>
            <button type="button" class="tool-btn" id="arrowTool" data-tooltip="箭头 A" aria-label="箭头">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4,12 L20,12 M20,12 L14,6 M20,12 L14,18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
            </button>
        </div>

        <!-- 颜色和画笔大小 -->
        <div class="toolbar-section">
            <div class="color-picker-wrapper">
                <input type="color" id="colorPicker" value="#498094" aria-label="标注颜色">
                <span id="colorCodeDisplay">#498094</span>
            </div>
            <div class="brush-size-wrapper">
                <input type="range" id="brushSize" min="1" max="50" value="5" aria-label="画笔大小">
                <div class="brush-preview">
                    <div class="brush-preview-dot" id="brushPreview"></div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="toolbar-section">
            <button type="button" class="tool-btn" id="undoBtn" data-tooltip="撤销" aria-label="撤销">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
            </button>
            <button type="button" class="tool-btn" id="redoBtn" data-tooltip="重做" aria-label="重做">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
            </button>
            <button type="button" class="tool-btn" id="clearBtn" data-tooltip="清除所有" aria-label="清除所有">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div id="viewerUndoToast" class="viewer-undo-toast" role="status" hidden>
            <span>已清除全部标注</span>
            <button type="button" id="viewerUndoClear" class="control-button">撤销</button>
        </div>
    </div>

    <div class="viewer-workspace">
    <main class="viewer-stage" aria-label="图片">
        <div class="image-container" id="imageContainer">
            <img id="viewerImage" alt="图片加载中或加载失败" style="display:none;">
            <canvas id="drawingCanvas"></canvas>
        </div>
        <div id="errorMessage" class="error-message" role="status" style="display:none;">无法加载图片。</div>
        <button type="button" id="viewerSidePrev" class="viewer-side-arrow is-prev" aria-label="上一张">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <button type="button" id="viewerSideNext" class="viewer-side-arrow is-next" aria-label="下一张">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
        </button>

    </main>
        <aside id="ocrResultModal" class="ocr-modal" aria-labelledby="ocrResultHeading">
            <div class="ocr-modal-content">
                <div class="ocr-panel-header">
                    <h2 id="ocrResultHeading">识别结果</h2>
                    <button type="button" id="ocrModalClose" class="ocr-modal-close control-button" aria-label="关闭识别结果" data-tooltip="关闭识别结果">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <textarea id="ocrResultText" aria-labelledby="ocrResultHeading" readonly></textarea>
                <button type="button" id="copyOcrText" class="control-button">复制文本</button>
            </div>
        </aside>
    </div>

    <footer id="viewerFilmstrip" class="viewer-filmstrip">
        <div id="viewerThumbs" class="viewer-thumbs" role="group" aria-label="同一话题的图片"></div>
        <div class="viewer-strip-meta">
            <div class="viewer-nav" role="group" aria-label="图片翻页">
                <button type="button" id="viewerPrevBtn" class="viewer-ibtn" aria-label="上一张" data-tooltip="上一张 ←">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg>
                </button>
                <span id="viewerIndexLabel" class="viewer-meta"></span>
                <button type="button" id="viewerNextBtn" class="viewer-ibtn" aria-label="下一张" data-tooltip="下一张 →">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>
                </button>
            </div>
            <button type="button" id="viewerZoomLabel" class="viewer-meta viewer-zoom" aria-label="缩放比例，点击适应窗口" data-tooltip="适应窗口 0">100%</button>
        </div>
    </footer>

    <script src="image-viewer.js"></script>
</body>
</html>
