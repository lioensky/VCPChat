name: Chat Kernel and UI gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'renderer.js'
      - 'main.html'
      - 'modules/**'
      - 'preloads/**'
      - 'styles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/chat-kernel-*.md'
      - 'docs/next-ui-current-state.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chat_kernel_ui.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Chat Kernel and UI contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without native rebuild
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --ignore-scripts --omit=optional

      - name: Run Chat Kernel tests
        run: npm run test:chat-kernel

      - name: Run complete UI system gate
        run: npm run check:ui-system
