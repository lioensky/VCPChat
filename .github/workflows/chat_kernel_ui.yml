name: Chat Kernel and UI gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'renderer.js'
      - 'main.html'
      - 'modules/**'
      - 'preloads/**'
      - 'styles/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/chat-kernel-*.md'
      - 'docs/contracts/**'
      - 'docs/next-ui-current-state.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chat_kernel_ui.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: Chat Kernel and UI contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust for built-artifact evidence
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-11

      - name: Install dependencies (including Electron runtime)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        # Electron's postinstall script downloads the runtime used by the
        # embedded-app contract tests. Do not suppress lifecycle scripts here;
        # this job does not perform native addon rebuilds.
        run: npm ci --omit=optional

      - name: Verify Electron runtime
        run: node -e "const electron = require('electron'); if (typeof electron !== 'string') { throw new Error('Electron runtime path was not installed'); } console.log(electron)"

      - name: Run Chat Kernel tests
        run: npm run test:chat-kernel

      - name: Run Chat contract evidence gate
        env:
          VCPCHAT_PACKAGED_ARTIFACT_SMOKE_OUTPUT: ${{ runner.temp }}/packaged-artifact-smoke.json
        run: npm run check:chat-evidence

      - name: Write Chat evidence manifest
        env:
          VCPCHAT_PACKAGED_ARTIFACT_EVIDENCE_INPUT: ${{ runner.temp }}/packaged-artifact-smoke.json
        run: npm run write:chat-evidence-manifest -- "$RUNNER_TEMP/chat-evidence-manifest.json"

      - name: Publish Chat evidence summary
        env:
          CHAT_EVIDENCE_MANIFEST: ${{ runner.temp }}/chat-evidence-manifest.json
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.env.CHAT_EVIDENCE_MANIFEST,'utf8')); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ['## Chat evidence','', '- status: `'+m.status+'`','- contracts/events: `'+m.checks.contracts+'/'+m.checks.generatedEvents+'`','- dynamic sites: registered `'+m.checks.dynamicSites.registered+'`, undiscovered `'+m.checks.dynamicSites.undiscovered+'`','- artifact plane: `'+m.checks.artifactPlane+'`','- packaged artifact: `'+m.checks.packagedArtifact+'`','- Windows matrix: `'+m.checks.windowsMatrix+'`','- manual soak: `'+m.checks.manualSoak+'`','- real Electron: `'+m.checks.realElectronSequence+'` (manual/platform evidence remains separate)',''].join('\\n'));"

      - name: Upload Chat evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: chat-evidence-manifest
          path: |
            ${{ runner.temp }}/chat-evidence-manifest.json
            ${{ runner.temp }}/packaged-artifact-smoke.json

      - name: Upload Chat evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: chat-evidence-bundle
          if-no-files-found: error
          path: |
            docs/contracts/chat-contract.schema.json
            docs/contracts/chat-contracts.json
            docs/contracts/generated/chat-event-graph.json
            docs/contracts/snapshots/*.json

      - name: Run complete UI system gate
        run: npm run check:ui-system
