<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻译</title>
    <!-- 假设主程序的 style.css 已经加载并定义了颜色变量 -->
<link rel="stylesheet" href="../styles/themes.css"> <!-- 引用主题样式 -->
    <!-- App Surface 共享视觉层（替代原主程序 style.css 全量样式栈） -->
    <link rel="stylesheet" href="../styles/app-surfaces/app-surfaces.css">
    <link rel="stylesheet" href="../styles/app-surfaces/app-surface-translator.css">
    <!-- 链接到新的、统一风格的 CSS 文件 -->
    <link rel="stylesheet" href="translator.css">
</head>
<body class="vcp-app-surface">
<!-- Custom Title Bar -->
    <div id="custom-title-bar" class="vcp-app-header">
        <div class="title vcp-app-header-title">VCP - 翻译</div>
        <div class="window-controls vcp-app-header-actions">
            <button id="translator-settings-btn" class="window-control-btn" title="翻译设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button id="minimize-translator-btn" class="window-control-btn" title="最小化">
                <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line></svg>
            </button>
            <button id="maximize-translator-btn" class="window-control-btn" title="最大化">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1" d="M0.5,0.5 h9 v9 h-9 z"></path></svg>
            </button>
            <button id="close-translator-btn" class="window-control-btn" title="关闭">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M0.5,0.5 9.5,9.5 M9.5,0.5 0.5,9.5" stroke="currentColor" stroke-width="1.2"></path></svg>
            </button>
        </div>
    </div>
    <div class="translator-container">
        <header class="translator-header vcp-app-toolbar">
            <div class="translator-controls vcp-app-toolbar-group vcp-app-toolbar-group--end">
                <select id="modelSelect" class="vcp-app-input">
                    <option value="fast">快速</option>
                    <option value="balanced">均衡</option>
                    <option value="quality">质量</option>
                </select>
                <select id="targetLanguageSelect" class="vcp-app-input">
                    <option value="en">英语</option>
                    <option value="zh">中文</option>
                    <option value="ja">日语</option>
                    <option value="ko">韩语</option>
                    <option value="fr">法语</option>
                    <option value="de">德语</option>
                    <option value="es">西班牙语</option>
                    <option value="custom">自定义</option>
                </select>
                <input type="text" id="customPromptVar" class="vcp-app-input" placeholder="提示词（可选）" title="自定义提示词，留空使用默认翻译行为">
                <button id="translateBtn" class="vcp-app-btn vcp-app-btn--primary">翻译</button>
            </div>
        </header>
        <main class="translator-main">
            <textarea id="sourceText" placeholder="输入或粘贴要翻译的文本…" rows="10"></textarea>
            <!-- 包裹文本框和按钮的容器 -->
            <div class="output-area">
                <textarea id="translatedText" placeholder="翻译结果将显示在这里..." rows="10" readonly></textarea>
                <!-- 复制按钮 -->
                <button id="copyBtn" class="vcp-app-icon-btn" title="复制译文">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
            </div>
        </main>
    </div>

    <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="settings-modal-backdrop" id="settingsModalBackdrop"></div>
        <div class="settings-modal-panel">
            <div class="settings-modal-header">
                <h3 id="settingsModalTitle">翻译设置</h3>
                <button id="closeSettingsModalBtn" class="settings-close-btn vcp-app-icon-btn" title="关闭设置">×</button>
            </div>
            <div class="settings-modal-body">
                <label class="setting-field">
                    <span>快速模型</span>
                    <input type="text" id="fastModelInput" placeholder="gemini-3.1-flash-lite-preview">
                </label>
                <label class="setting-field">
                    <span>均衡模型</span>
                    <input type="text" id="balancedModelInput" placeholder="gemini-3-flash-preview">
                </label>
                <label class="setting-field">
                    <span>质量模型</span>
                    <input type="text" id="qualityModelInput" placeholder="gemini-3.1-pro">
                </label>
                <label class="setting-toggle">
                    <span>
                        <strong>流式翻译</strong>
                        <small>开启后逐步显示译文；关闭后等待完整结果返回。</small>
                    </span>
                    <input type="checkbox" id="streamModeToggle">
                    <span class="toggle-slider" aria-hidden="true"></span>
                </label>
                <div id="settingsSaveStatus" class="settings-save-status" aria-live="polite"></div>
            </div>
            <div class="settings-modal-footer">
                <button id="resetSettingsBtn" class="secondary-btn vcp-app-btn">恢复默认</button>
                <button id="saveSettingsBtn" class="primary-btn vcp-app-btn vcp-app-btn--primary">保存设置</button>
            </div>
        </div>
    </div>

    <script src="translator.js"></script>
</body>
</html>
