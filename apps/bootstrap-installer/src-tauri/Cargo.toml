[package]
name = "vcpchat-bootstrap-installer"
version = "0.1.0"
description = "VCPChat Setup"
authors = ["VCPChat contributors"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "VCPChat-Setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
