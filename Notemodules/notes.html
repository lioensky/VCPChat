<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的笔记</title>
    <link rel="stylesheet" href="../styles/themes.css" />
    <link rel="stylesheet" href="notes.css" />
    <!-- 用于语法高亮的 Highlight.js -->
    <link
      rel="stylesheet"
      href="../vendor/atom-one-dark.min.css"
      id="highlight-theme-style"
    />
    <script src="../vendor/marked.min.js"></script>
    <script src="../vendor/highlight.min.js"></script>
    <!-- DOMPurify for HTML sanitization -->
    <script src="../vendor/purify.min.js"></script>
    <!-- Pele for diagram rendering -->
    <script src="../vendor/pele.global.js"></script>
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="../vendor/katex.min.css" />
    <script defer src="../vendor/katex.min.js" crossorigin="anonymous"></script>
    <script
      defer
      src="../vendor/auto-render.min.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="window-controls">
      <button
        id="minimize-notes-btn"
        class="window-btn"
        type="button"
        title="最小化"
        aria-label="最小化"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <button
        id="maximize-notes-btn"
        class="window-btn"
        type="button"
        title="最大化"
        aria-label="最大化"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg>
      </button>
      <button
        id="close-notes-btn"
        class="window-btn window-btn-close"
        type="button"
        title="关闭"
        aria-label="关闭"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="shell">
      <!-- 用于笔记列表和操作的侧边栏 -->
      <aside class="sidebar" aria-label="笔记列表">
        <div class="sidebar-header">
          <div class="sidebar-title sidebar-heading">
            <span>我的笔记</span>
            <div class="sidebar-title-actions">
              <button
                id="noteFilterBtn"
                class="nav-icon-btn"
                type="button"
                title="筛选和排序"
                aria-label="筛选和排序"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="noteFilterMenu"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M7 12h10"></path><path d="M10 17h4"></path></svg>
              </button>
              <button
                id="helpBtn"
                class="nav-icon-btn"
                type="button"
                title="查看笔记使用帮助"
                aria-label="帮助"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"></path><path d="M12 17h.01"></path></svg>
              </button>
              <button
                id="newItemBtn"
                class="nav-icon-btn"
                type="button"
                title="新建"
                aria-label="新建"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="newItemMenu"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
              </button>
            </div>

            <div
              id="newItemMenu"
              class="notes-popover"
              role="menu"
              aria-label="新建"
              hidden
            >
              <button id="newMdBtn" class="popover-item" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6"></path><path d="M9 17h4"></path></svg>
                <span class="popover-item-label">新建笔记</span>
                <span class="popover-item-hint">.md</span>
              </button>
              <button id="newTxtBtn" class="popover-item" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
                <span class="popover-item-label">新建文本</span>
                <span class="popover-item-hint">.txt</span>
              </button>
              <button id="newFolderBtn" class="popover-item" type="button" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2h7.4a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>
                <span class="popover-item-label">新建文件夹</span>
              </button>
              <div class="popover-separator" role="separator"></div>
              <div class="popover-label" id="newFromTemplateLabel">从模板新建</div>
              <div role="group" aria-labelledby="newFromTemplateLabel">
                <button class="popover-item" type="button" role="menuitem" data-note-template="learning">
                  <span class="popover-item-label">学习笔记</span>
                </button>
                <button class="popover-item" type="button" role="menuitem" data-note-template="meeting">
                  <span class="popover-item-label">会议记录</span>
                </button>
                <button class="popover-item" type="button" role="menuitem" data-note-template="project">
                  <span class="popover-item-label">项目计划</span>
                </button>
                <button class="popover-item" type="button" role="menuitem" data-note-template="troubleshooting">
                  <span class="popover-item-label">问题排查</span>
                </button>
              </div>
            </div>

            <!-- notes.js 根据下方隐藏的选择框生成这里的单选行 -->
            <div
              id="noteFilterMenu"
              class="notes-popover"
              role="menu"
              aria-label="筛选和排序"
              hidden
            ></div>
          </div>
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input
              type="text"
              id="searchInput"
              placeholder="搜索标题、内容或标签"
              aria-label="搜索笔记"
            />
          </div>
          <div id="noteFilterSummary" class="note-filter-summary" hidden>
            <span id="noteFilterSummaryText" class="note-filter-summary-text"></span>
            <button
              id="noteFilterClearBtn"
              class="nav-icon-btn note-filter-clear"
              type="button"
              title="清除筛选"
              aria-label="清除筛选"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
          </div>
          <!-- 筛选状态：由筛选菜单写入，renderTree() 读取 -->
          <div class="note-filter-state" hidden>
            <select id="noteScopeFilter" aria-label="笔记来源" data-filter-label="来源">
              <option value="all">全部</option>
              <option value="local">仅本地</option>
              <option value="network">仅网络</option>
            </select>
            <select id="noteTagFilter" aria-label="标签" data-filter-label="标签">
              <option value="">全部</option>
            </select>
            <select id="noteSortSelect" aria-label="排序" data-filter-label="排序">
              <option value="custom">自定义顺序</option>
              <option value="updated">最近修改</option>
              <option value="created">最早创建</option>
              <option value="title">标题 A-Z</option>
            </select>
          </div>
        </div>
        <ul id="noteList" class="note-list-panel" aria-live="polite">
          <!-- 笔记项目将由 JavaScript 动态插入此处 -->
        </ul>
        <!-- 拖动调整侧边栏宽度 -->
        <div class="resizer" id="resizer" aria-hidden="true"></div>
      </aside>

      <!-- 用于笔记编辑和预览的主内容区域 -->
      <section class="panel-frame">
        <main class="main-content">
          <header class="note-editor-header">
            <div class="note-editor-copy">
              <input
                type="text"
                id="noteTitle"
                placeholder="笔记标题"
                aria-label="笔记标题（同时是文件名）"
              />
              <p id="noteMeta" class="note-meta" aria-live="polite"></p>
            </div>
            <div class="note-actions">
              <div class="view-mode-group" role="group" aria-label="编辑视图">
                <button
                  class="toolbar-button view-mode-button"
                  type="button"
                  data-view-mode="editor"
                  aria-pressed="false"
                >
                  编辑
                </button>
                <button
                  class="toolbar-button view-mode-button is-active"
                  type="button"
                  data-view-mode="split"
                  aria-pressed="true"
                >
                  分栏
                </button>
                <button
                  class="toolbar-button view-mode-button"
                  type="button"
                  data-view-mode="preview"
                  aria-pressed="false"
                >
                  预览
                </button>
              </div>
              <button
                id="deleteNoteBtn"
                class="nav-icon-btn note-delete-btn"
                type="button"
                title="删除"
                aria-label="删除"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4.5h6V7"></path><path d="m6 7 1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
              </button>
              <button
                id="saveNoteBtn"
                class="button button-primary"
                type="button"
              >
                保存
              </button>
            </div>
          </header>
          <div class="note-surface">
            <div class="note-workspace-toolbar" aria-label="笔记编辑工具">
              <div
                class="formatting-toolbar"
                role="toolbar"
                aria-label="Markdown 格式工具"
              >
                <div class="toolbar-group">
                  <button class="toolbar-button" type="button" data-markdown-action="bold" title="加粗（Ctrl+B）" aria-label="加粗">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5h5.5a3.5 3.5 0 0 1 0 7H7z"></path><path d="M7 12h6.5a3.5 3.5 0 0 1 0 7H7z"></path></svg>
                  </button>
                  <button class="toolbar-button" type="button" data-markdown-action="italic" title="斜体（Ctrl+I）" aria-label="斜体">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5h-8"></path><path d="M14 19H6"></path><path d="M15 5 9 19"></path></svg>
                  </button>
                  <button class="toolbar-button" type="button" data-markdown-action="heading" title="标题" aria-label="标题">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M18 5v14"></path><path d="M6 12h12"></path></svg>
                  </button>
                </div>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <div class="toolbar-group">
                  <button class="toolbar-button" type="button" data-markdown-action="bulletList" title="无序列表" aria-label="无序列表">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11"></path><path d="M9 12h11"></path><path d="M9 18h11"></path><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"></circle><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"></circle><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"></circle></svg>
                  </button>
                  <button class="toolbar-button" type="button" data-markdown-action="quote" data-toolbar-overflow title="引用" aria-label="引用">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14"></path><path d="M10 8h9"></path><path d="M10 12h9"></path><path d="M10 16h6"></path></svg>
                  </button>
                  <button class="toolbar-button" type="button" data-markdown-action="code" data-toolbar-overflow title="代码块" aria-label="代码块">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 8-4 4 4 4"></path><path d="m16 8 4 4-4 4"></path><path d="m13.5 5-3 14"></path></svg>
                  </button>
                </div>
                <span class="toolbar-divider" aria-hidden="true"></span>
                <div class="toolbar-group">
                  <button class="toolbar-button" type="button" data-markdown-action="link" title="链接" aria-label="链接">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"></path><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg>
                  </button>
                  <button class="toolbar-button" type="button" data-markdown-action="tag" data-toolbar-overflow title="标签行" aria-label="标签行">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h15"></path><path d="M4 15h15"></path><path d="M10 4 8 20"></path><path d="m16 4-2 16"></path></svg>
                  </button>
                  <button id="insertImageBtn" class="toolbar-button" type="button" data-toolbar-overflow title="插入图片" aria-label="插入图片">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m20.5 15.5-5-5-9.5 9"></path></svg>
                  </button>
                  <input id="imageFileInput" type="file" accept="image/*" hidden />
                </div>
                <button
                  id="formatOverflowBtn"
                  class="toolbar-button format-overflow-btn"
                  type="button"
                  title="更多格式"
                  aria-label="更多格式"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-controls="formatOverflowMenu"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18.5" cy="12" r="1.5"></circle></svg>
                </button>
              </div>
            </div>
            <div class="note-body">
              <!-- Editor Area -->
              <div class="editor-container">
                <div
                  id="editorFindBar"
                  class="editor-find-bar"
                  aria-label="编辑区搜索"
                  hidden
                >
                  <input
                    type="text"
                    id="editorFindInput"
                    placeholder="搜索当前笔记..."
                    aria-label="搜索当前笔记"
                  />
                  <span id="editorFindStatus" class="editor-find-status">0/0</span>
                  <button
                    id="editorFindPrev"
                    type="button"
                    class="editor-find-button"
                    title="上一个匹配"
                  >
                    ↑
                  </button>
                  <button
                    id="editorFindNext"
                    type="button"
                    class="editor-find-button"
                    title="下一个匹配"
                  >
                    ↓
                  </button>
                  <button
                    id="editorFindClose"
                    type="button"
                    class="editor-find-button"
                    title="关闭搜索"
                  >
                    ×
                  </button>
                </div>
                <textarea
                  id="noteContent"
                  placeholder="开始写笔记..."
                  aria-label="笔记内容"
                ></textarea>
              </div>
              <div
                id="editorPreviewResizer"
                class="editor-preview-resizer"
                role="separator"
                aria-orientation="vertical"
                aria-label="调整编辑区和预览区宽度"
                title="拖动调整编辑区/预览区比例"
              ></div>
              <!-- Preview Area -->
              <div class="preview-container">
                <div
                  id="previewContent"
                  class="markdown-preview"
                  aria-live="polite"
                >
                  <!-- Markdown 预览将在此处渲染 -->
                </div>
              </div>
            </div>
          </div>
        </main>
      </section>
    </div>
    <!-- Pretext 文本布局引擎 -->
    <script type="module" src="../modules/renderer/pretext-bridge.js"></script>
    <script src="notes.js"></script>

    <!-- Custom Context Menu HTML -->
    <div id="customContextMenu" class="custom-context-menu">
      <ul>
        <li id="context-rename">重命名</li>
        <li id="context-copy-note">复制笔记</li>
        <li class="separator" role="separator"></li>
        <li id="context-delete" class="danger">删除</li>
      </ul>
    </div>

    <!-- Formatting tools that fold out of a narrow toolbar -->
    <div
      id="formatOverflowMenu"
      class="notes-popover is-anchored"
      role="menu"
      aria-label="更多格式"
      hidden
    >
      <button class="popover-item" type="button" role="menuitem" data-markdown-action="quote">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14"></path><path d="M10 8h9"></path><path d="M10 12h9"></path><path d="M10 16h6"></path></svg>
        <span class="popover-item-label">引用</span>
      </button>
      <button class="popover-item" type="button" role="menuitem" data-markdown-action="code">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 8-4 4 4 4"></path><path d="m16 8 4 4-4 4"></path><path d="m13.5 5-3 14"></path></svg>
        <span class="popover-item-label">代码块</span>
      </button>
      <button class="popover-item" type="button" role="menuitem" data-markdown-action="tag">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h15"></path><path d="M4 15h15"></path><path d="M10 4 8 20"></path><path d="m16 4-2 16"></path></svg>
        <span class="popover-item-label">标签行</span>
      </button>
      <button class="popover-item" type="button" role="menuitem" data-overflow-image>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="m20.5 15.5-5-5-9.5 9"></path></svg>
        <span class="popover-item-label">插入图片</span>
      </button>
    </div>

    <!-- Editor Context Menu HTML -->
    <div id="editorContextMenu" class="custom-context-menu editor-context-menu">
      <ul>
        <li id="editor-context-undo">撤回</li>
        <li id="editor-context-cut">剪切</li>
        <li id="editor-context-copy">复制</li>
        <li id="editor-context-paste">粘贴</li>
        <li id="editor-context-select-all">全选</li>
      </ul>
    </div>
    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal-overlay" style="display: none">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h3 id="modalTitle">确认操作</h3>
        <p id="modalMessage">你确定要执行这个操作吗？</p>
        <div class="modal-actions">
          <button id="modalConfirmBtn" class="button button-danger" type="button">
            删除
          </button>
          <button id="modalCancelBtn" class="button" type="button">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
