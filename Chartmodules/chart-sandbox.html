<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none';">
    <title>VCP Chart Sandbox</title>
    <style>
        html,
        body,
        #vcp-chart-root {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: #fff;
            background: transparent;
            font-family: system-ui, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="vcp-chart-root"></div>
    <script src="chart-sandbox.js"></script>
</body>
</html>
