<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'none';">
    <title>VCP 图表工作台</title>
    <link rel="stylesheet" href="../styles/themes.css">
    <link rel="stylesheet" href="chart.css">
</head>
<body>
    <header class="titlebar">
        <div class="titlebar-brand">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3v18h18"></path>
                <path d="m7 16 4-5 4 3 5-7"></path>
            </svg>
            <span>图表工作台</span>
        </div>
        <div class="titlebar-status" id="globalStatus">正在连接图表服务…</div>
        <div class="window-controls">
            <button id="refreshButton" type="button" title="刷新列表" aria-label="刷新列表">
                <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg>
            </button>
            <button id="minimizeButton" type="button" title="最小化" aria-label="最小化">
                <svg viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
            </button>
            <button id="maximizeButton" type="button" title="最大化" aria-label="最大化">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"></rect></svg>
            </button>
            <button id="closeButton" class="danger" type="button" title="关闭" aria-label="关闭">
                <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
    </header>

    <main class="workspace">
        <aside class="chart-sidebar" aria-label="图表列表">
            <div class="sidebar-heading">
                <div>
                    <strong>图表</strong>
                    <span id="chartCount">0</span>
                </div>
                <button id="collapseSidebarButton" class="icon-button" type="button" title="收起侧栏" aria-label="收起侧栏">
                    <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
                </button>
            </div>
            <label class="search-box">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-3.5-3.5"></path>
                </svg>
                <input id="chartSearchInput" type="search" placeholder="搜索名称或 ID" autocomplete="off">
            </label>
            <div id="chartList" class="chart-list" role="listbox" aria-label="已有图表">
                <div class="list-placeholder">暂无图表</div>
            </div>
            <footer class="sidebar-footer">
                <span>Agent 创建的图表会自动出现</span>
            </footer>
        </aside>

        <section class="chart-stage">
            <div class="stage-toolbar">
                <button id="expandSidebarButton" class="icon-button sidebar-expand" type="button" title="展开侧栏" aria-label="展开侧栏">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"></path></svg>
                </button>
                <div class="stage-identity">
                    <h1 id="chartTitle">选择一个图表</h1>
                    <div id="chartMeta">从左侧列表选择要展示的图表</div>
                </div>
                <div class="stage-actions">
                    <span id="runtimeBadge" class="runtime-badge idle">未加载</span>
                    <button id="detachChartButton" class="text-button" type="button" disabled>悬浮展示</button>
                    <button id="dockChartButton" class="text-button" type="button" hidden>回到工作台</button>
                    <button id="pinChartButton" class="text-button" type="button" aria-pressed="true" hidden>已置顶</button>
                    <button id="reloadChartButton" class="icon-button" type="button" title="重新加载图表" aria-label="重新加载图表" disabled>
                        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg>
                    </button>
                    <button id="devtoolsButton" class="icon-button" type="button" title="开发者工具" aria-label="开发者工具">
                        <svg viewBox="0 0 24 24"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"></path></svg>
                    </button>
                </div>
            </div>

            <div id="stageBody" class="stage-body">
                <div id="detachedState" class="empty-state" hidden>
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M10 3h11v11M21 3 10 14"></path></svg>
                    </div>
                    <h2>独立展示中</h2>
                    <p>此图表正在桌面悬浮窗中运行，工作台已停止渲染，避免重复占用资源。</p>
                    <div class="detached-actions">
                        <button id="focusFloatingButton" class="text-button" type="button">定位悬浮窗</button>
                        <button id="restoreChartButton" class="text-button" type="button">收回工作台</button>
                    </div>
                </div>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"></path><path d="m7 16 4-5 4 3 5-7"></path></svg>
                    </div>
                    <h2>没有正在展示的图表</h2>
                    <p>图表由 Agent 创建并通过外置数据持续更新。选择左侧项目即可查看。</p>
                </div>
                <div
                    id="chartFrame"
                    class="chart-frame"
                    role="document"
                    aria-label="图表渲染区域"
                    hidden
                ></div>
                <div id="runtimeOverlay" class="runtime-overlay" hidden>
                    <div class="overlay-card">
                        <div class="spinner"></div>
                        <strong id="overlayTitle">正在加载图表</strong>
                        <span id="overlayDescription">准备本地渲染依赖…</span>
                    </div>
                </div>
                <section id="errorPanel" class="error-panel" hidden>
                    <div>
                        <strong>图表运行时发生错误</strong>
                        <pre id="errorMessage"></pre>
                    </div>
                    <button id="retryButton" type="button">重新加载</button>
                </section>
            </div>
        </section>
    </main>

    <div id="chartContextMenu" class="chart-context-menu" role="menu" aria-label="图表操作" hidden>
        <button type="button" role="menuitem" data-action="detach">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M10 3h11v11M21 3 10 14"></path></svg>
            <span>悬浮展示 / 定位窗口</span>
        </button>
        <button type="button" role="menuitem" data-action="edit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path>
            </svg>
            <span>在 Canvas 中编辑</span>
        </button>
        <div class="context-menu-separator" role="separator"></div>
        <button type="button" class="danger" role="menuitem" data-action="delete">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5M14 11v5"></path>
            </svg>
            <span>删除图表</span>
        </button>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite"></div>
    <script src="chart-runtime.js"></script>
    <script src="chart.js"></script>
</body>
</html>
