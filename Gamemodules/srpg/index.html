<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'">
<title>Tavern-SRPG · 万缕千丝战棋战术沙盘</title>
<link rel="stylesheet" href="../../vendor/fontawesome-v6/fontawesome-v6.css">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --SmartThemeBlurTintColor: #111827;
    --SmartThemeBodyColor: #e2e8f0;
    --SmartThemeQuoteColor: #f59e0b;
    --SmartThemeBlurStrength: 0px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0f19;
    color: #e2e8f0;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #vcp-srpg-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    background: linear-gradient(90deg, #0f172a, #1e1b4b);
    border-bottom: 1px solid rgba(245, 158, 11, 0.3);
    font-size: 13px;
    flex-shrink: 0;
    z-index: 4000;
  }
  .vcp-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #fef3c7;
  }
  .vcp-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(245, 158, 11, 0.18);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.4);
    font-weight: 600;
  }
  .vcp-top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vcp-top-btn {
    background: rgba(255, 255, 255, 0.08);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 7px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .vcp-top-btn:hover {
    background: rgba(245, 158, 11, 0.22);
    border-color: #f59e0b;
    color: #fff;
  }
  #vcp-srpg-stage {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
  }
  /* 让 Tavern-SRPG 面板在独立窗口中默认铺满全屏工作区 */
  #tsrpg-panel.tsrpg-panel.float {
    position: relative !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    border-radius: 0 !important;
    border: none !important;
    resize: none !important;
    box-shadow: none !important;
  }
  #tsrpg-panel .tsrpg-header {
    cursor: default !important;
    padding: 8px 14px;
  }
  .text_pole, .menu_button {
    background: rgba(15, 23, 42, 0.85);
    color: #e2e8f0;
    border: 1px solid rgba(148, 163, 184, 0.28);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 13px;
  }
  .menu_button {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .menu_button:hover {
    background: rgba(245, 158, 11, 0.2);
    border-color: rgba(245, 158, 11, 0.55);
  }
  #vcp-toast-box {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .vcp-toast {
    background: rgba(15, 23, 42, 0.95);
    border-left: 4px solid #f59e0b;
    color: #f8fafc;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  #send_textarea {
    display: none;
  }
</style>
<script type="module" src="ui.js"></script>
</head>
<body>
<header id="vcp-srpg-topbar">
  <div class="vcp-brand">
    <i class="fa-solid fa-chess-knight" style="color:#f59e0b;font-size:16px"></i>
    <span>万缕千丝 · 战棋战术沙盘</span>
    <span class="vcp-badge" id="vcp-sync-status">同步就绪</span>
  </div>
  <div class="vcp-top-actions">
    <span style="color:#94a3b8;font-size:12px">提示：开启「手动修改」可随时按 NS2 实机同步单位位置、HP 与属性；支持天刻回溯存档</span>
    <button type="button" class="vcp-top-btn" id="vcp-copy-context-btn"><i class="fa-solid fa-map"></i> 复制战场全貌</button>
    <button type="button" class="vcp-top-btn" id="vcp-copy-report-btn"><i class="fa-solid fa-scroll"></i> 查看/复制最新战报</button>
  </div>
</header>
<main id="vcp-srpg-stage"></main>
<textarea id="send_textarea" aria-hidden="true"></textarea>
<button id="send_but" type="button" hidden></button>
<div id="vcp-toast-box" aria-live="polite"></div>
</body>
</html>
