<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'none'">
<title>Vgame · 斗地主</title>
<link rel="stylesheet" href="../../styles/themes.css">
<link rel="stylesheet" href="style.css">
<script defer src="ui.js"></script>
</head>
<body>
<header>
  <h1>♠ 斗地主 <small>庄园牌桌 · AI 竞技场</small></h1>
  <button id="toggle-reveal" type="button" hidden>👁 上帝明牌：开</button>
  <button id="resume" type="button">恢复上桌</button>
  <button id="continue" type="button">继续 / 重试</button>
  <button id="stop" type="button">暂停后续行动</button>
</header>

<section class="setup">
  <div class="setup-top">
    <div class="mode-switch" role="group" aria-label="对局模式">
      <button id="mode-spectate" type="button" class="mode-btn active">🍿 三 AI 斗蛐蛐（我观战）</button>
      <button id="mode-human" type="button" class="mode-btn">🃏 我亲自上桌（1人+2AI）</button>
    </div>
    <label id="human-name-wrap" hidden>你的名字 <input id="user-name" value="莱恩" maxlength="100"></label>
    <label>上下文楼层 <input id="context-size" type="number" min="1" max="1000" value="100"></label>
    <label title="关闭后，无牌可压也保留行动与聊天回合。局中切换从下一次行动结算生效。"><input id="auto-pass" type="checkbox" checked> 无牌可压时自动过牌</label>
    <button id="refresh-models" type="button" class="ghost-btn">🔄 刷新模型列表</button>
    <div class="setup-cta">
      <button id="create" type="button" class="primary-btn">开新桌</button>
      <button id="next" type="button" disabled>再来一局（保留上下文）</button>
    </div>
  </div>

  <div class="seat-configs">
    <div id="slot-zero-card" class="seat-config-card">
      <div class="slot-title" id="slot-zero-title">一号位 AI · 首叫席</div>
      <label>出战角色 <select id="agent-zero"></select></label>
      <label>本局模型 <select id="model-zero"></select></label>
      <input id="custom-model-zero" class="custom-model-input" type="text" maxlength="200" placeholder="输入自定义模型 ID…" hidden>
    </div>

    <div id="slot-one-card" class="seat-config-card">
      <div class="slot-title" id="slot-one-title">二号位 AI</div>
      <label>出战角色 <select id="agent-one"></select></label>
      <label>本局模型 <select id="model-one"></select></label>
      <input id="custom-model-one" class="custom-model-input" type="text" maxlength="200" placeholder="输入自定义模型 ID…" hidden>
    </div>

    <div id="slot-two-card" class="seat-config-card">
      <div class="slot-title" id="slot-two-title">三号位 AI</div>
      <label>出战角色 <select id="agent-two"></select></label>
      <label>本局模型 <select id="model-two"></select></label>
      <input id="custom-model-two" class="custom-model-input" type="text" maxlength="200" placeholder="输入自定义模型 ID…" hidden>
    </div>
  </div>
</section>

<p id="status" role="status" aria-live="polite">正在连接游戏后台…</p>

<main>
  <section class="table">
    <div id="seats" class="seats"></div>
    <div id="target" class="target">选好三位 AI 与各自模型，点击「开新桌」即可坐山观虎斗。</div>
    <div id="bottom" class="bottom-bar"></div>

    <div id="spectator-banner" class="spectator-banner">
      🍿 包厢观战席：三位 AI 将按真实私有手牌与记牌器自动交锋，本局单座模型配置仅对当前牌桌生效，不改动角色日常默认模型。
    </div>

    <div id="human-zone" hidden>
      <h2>你的手牌 <small>点击选牌，再确认提交</small></h2>
      <div id="hand" class="hand"></div>
      <div class="actions">
        <button data-bid="0" type="button">不叫</button>
        <button data-bid="1" type="button">1分</button>
        <button data-bid="2" type="button">2分</button>
        <button data-bid="3" type="button">3分</button>
        <button id="play" type="button">出选中的牌</button>
        <button id="pass" type="button">不出</button>
        <button id="clear" type="button">清空选择</button>
      </div>
      <label class="field-block">随行动说一句（可空）<textarea id="speech" maxlength="2000" rows="2"></textarea></label>
      <label class="field-block">表情图片 URL（可空）<input id="emote" type="url" maxlength="2048" placeholder="http://…"></label>
      <button id="retry" type="button" hidden>重试原提交</button>
    </div>
  </section>

  <aside>
    <h2>桌上发生了什么</h2>
    <div id="events" aria-live="polite"></div>
  </aside>
</main>
</body>
</html>
