<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题选择</title>
    <!-- The main theme file is now loaded first to provide base variables -->
    <link rel="stylesheet" href="../styles/themes.css"> 
    <link rel="stylesheet" href="themes-module.css">
</head>
<body>
    <!-- Custom Title Bar -->
    <div id="custom-title-bar">
        <div class="title">VCP - 主题选择</div>
        <div class="window-controls">
            <button id="minimize-theme-btn" class="window-control-btn" title="最小化">
                <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"></line></svg>
            </button>
            <button id="maximize-theme-btn" class="window-control-btn" title="最大化">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="none" stroke="currentColor" stroke-width="1" d="M0.5,0.5 h9 v9 h-9 z"></path></svg>
            </button>
            <button id="close-theme-btn" class="window-control-btn" title="关闭">
                <svg width="10" height="10" viewBox="0 0 10 10"><path fill="currentColor" d="M0.5,0.5 9.5,9.5 M9.5,0.5 0.5,9.5" stroke="currentColor" stroke-width="1.2"></path></svg>
            </button>
        </div>
    </div>
    <div class="container">
        <header class="theme-header">
            <div class="header-content">
                <h1 class="main-title">主题外观定制</h1>
                <p class="sub-title">切换应用视觉风格，支持深色与浅色双模式全景联动</p>
            </div>
            <!-- 搜索与筛选工具栏 -->
            <div class="toolbar">
                <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="themeSearchInput" placeholder="检索主题名称、风格关键词..." autocomplete="off" spellcheck="false">
                    <button id="clearSearchBtn" class="clear-search-btn" title="清除检索" style="display: none;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="theme-counter" id="themeCountBadge">共 0 套主题</div>
            </div>
        </header>

        <!-- 主题卡片网格容器 -->
        <section class="themes-section">
            <div class="themes-grid" id="themesGrid">
                <!-- Theme cards will be dynamically generated by JS -->
            </div>
            <div id="noThemesFallback" class="no-themes-fallback" style="display: none;">
                <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
                <div class="fallback-text">未找到匹配的主题方案</div>
                <div class="fallback-sub">请尝试缩短或更换检索关键词</div>
            </div>
        </section>

        <!-- 实时双模式全景交互预览 -->
        <section class="theme-preview-section">
            <div class="preview-header">
                <div class="preview-header-left">
                    <span class="preview-title">动态实时预览</span>
                    <span class="preview-badge" id="previewThemeName">未选中</span>
                </div>
                <div class="preview-modes-hint">
                    <span class="mode-pill dark"><span class="pill-dot"></span>深色界面</span>
                    <span class="mode-pill light"><span class="pill-dot"></span>浅色界面</span>
                </div>
            </div>
            
            <div class="preview-box" id="previewBox">
                <!-- Left Pane (Simulates Sidebar/Panels with Dark Mode) -->
                <div class="preview-pane dark-pane" id="preview-pane-1">
                    <div class="preview-wallpaper-bg" id="preview-wallpaper-1"></div>
                    <div class="preview-glass-card">
                        <div class="mock-header">
                            <div class="mock-avatar"></div>
                            <div class="mock-meta">
                                <div class="mock-title"></div>
                                <div class="mock-text short"></div>
                            </div>
                        </div>
                        <div class="mock-bubble user-bubble">
                            <div class="mock-line"></div>
                            <div class="mock-line short"></div>
                        </div>
                        <div class="mock-bubble assistant-bubble">
                            <div class="mock-line"></div>
                            <div class="mock-line"></div>
                            <div class="mock-line short"></div>
                        </div>
                    </div>
                    <!-- Controls for Pane 1 -->
                    <div class="preview-button-container" id="preview-buttons-1">
                        <button class="preview-button">主控按键</button>
                        <button class="preview-button alt">辅助轮廓</button>
                    </div>
                </div>

                <!-- Right Pane (Simulates Content Area with Light Mode) -->
                <div class="preview-pane light-pane" id="preview-pane-2">
                    <div class="preview-wallpaper-bg" id="preview-wallpaper-2"></div>
                    <div class="preview-glass-card">
                        <div class="mock-header">
                            <div class="mock-avatar"></div>
                            <div class="mock-meta">
                                <div class="mock-title"></div>
                                <div class="mock-text short"></div>
                            </div>
                        </div>
                        <div class="mock-bubble user-bubble">
                            <div class="mock-line"></div>
                            <div class="mock-line short"></div>
                        </div>
                        <div class="mock-bubble assistant-bubble">
                            <div class="mock-line"></div>
                            <div class="mock-line"></div>
                            <div class="mock-line short"></div>
                        </div>
                    </div>
                    <!-- Controls for Pane 2 -->
                    <div class="preview-button-container" id="preview-buttons-2">
                        <button class="preview-button">主控按键</button>
                        <button class="preview-button alt">辅助轮廓</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 操作底栏 -->
        <footer class="theme-footer">
            <div class="current-status-tip" id="currentStatusTip">已选定主题方案</div>
            <button id="saveThemeBtn" class="save-button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>应用并刷新全局</span>
            </button>
        </footer>
    </div>
    <script src="themes.js"></script>
</body>
</html>
