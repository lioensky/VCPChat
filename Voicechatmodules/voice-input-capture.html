<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
    <title>VCP Voice Input Capture</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: rgba(12, 18, 28, 0.96);
            color: #ffffff;
            font: 12px/1.3 system-ui, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            gap: 6px;
            box-sizing: border-box;
            padding: 5px 7px;
            border: 1px solid rgba(90, 190, 255, 0.72);
            border-radius: 8px;
        }

        #captureState {
            flex: 0 0 auto;
            color: #5ed0ff;
            white-space: nowrap;
        }

        #captureInput {
            flex: 1 1 auto;
            min-width: 0;
            height: 26px;
            box-sizing: border-box;
            margin: 0;
            padding: 3px 7px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 5px;
            outline: 0;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            caret-color: #5ed0ff;
            font: inherit;
        }

        #captureInput:focus {
            border-color: rgba(94, 208, 255, 0.92);
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 0 1px rgba(94, 208, 255, 0.22);
        }
    </style>
</head>
<body>
    <span id="captureState" role="status" aria-live="polite">正在听写</span>
    <input id="captureInput" type="text" aria-label="系统语音输入捕获区"
        autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <script src="voice-input-capture.js"></script>
</body>
</html>
