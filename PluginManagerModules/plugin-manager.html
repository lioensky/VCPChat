<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: file:; connect-src *;">
    <title>VCP 插件管理器</title>
    <link rel="stylesheet" href="../styles/themes.css">
    <link rel="stylesheet" href="plugin-manager.css">
</head>
<body>
    <div class="window-controls">
        <button id="minimize-btn" class="window-btn" title="最小化" aria-label="最小化">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="maximize-btn" class="window-btn" title="最大化" aria-label="最大化">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg>
        </button>
        <button id="close-btn" class="window-btn window-btn-close" title="关闭" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <div class="shell">
        <aside class="sidebar" aria-label="插件分类">
            <div class="sidebar-title">插件管理器</div>
            <div class="nav-group">
                <div class="nav-group-label">插件</div>
                <div id="plugin-type-tabs" class="nav-list" role="tablist" aria-orientation="vertical" aria-label="插件类型"></div>
            </div>
            <div class="nav-group">
                <div class="nav-group-label">服务</div>
                <div class="nav-list">
                    <button type="button" id="nav-server" class="nav-item" data-view="server" title="分布式服务器">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"></rect><rect x="3" y="14" width="18" height="6" rx="2"></rect><path d="M7 7h.01M7 17h.01"></path></svg>
                        <span class="nav-label">分布式服务器</span>
                    </button>
                </div>
            </div>
        </aside>

        <section class="panel-frame">
            <main class="app-container">
                <div class="plugins-page">
                    <p id="plugin-notice" class="plugins-notice" role="status" aria-live="polite"></p>

                    <section id="view-plugins" class="view" aria-labelledby="page-title">
                        <header class="page-head page-head-row">
                            <div class="page-head-copy">
                                <h1 id="page-title" class="page-title">全部插件</h1>
                                <div id="summary-dashboard" class="page-intro" aria-live="polite"></div>
                            </div>
                            <button id="refresh-btn" class="nav-icon-btn" title="重新扫描插件" aria-label="重新扫描插件">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                            </button>
                        </header>

                        <section class="filters" aria-label="筛选插件">
                            <div class="search-box">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                                <input id="plugin-search-input" type="search" placeholder="搜索插件、命令、描述或配置项..." aria-label="搜索插件">
                            </div>
                            <div id="plugin-state-filter" class="segmented" role="radiogroup" aria-label="按状态筛选">
                                <button type="button" role="radio" data-state="all" aria-checked="true">全部</button>
                                <button type="button" role="radio" data-state="enabled" aria-checked="false">已启用</button>
                                <button type="button" role="radio" data-state="disabled" aria-checked="false">已禁用</button>
                                <button type="button" role="radio" data-state="invalid" aria-checked="false">异常</button>
                            </div>
                        </section>

                        <section id="plugin-groups" class="plugin-groups">
                            <div class="empty-state">正在扫描 VCPDistributedServer/Plugin ...</div>
                        </section>
                    </section>

                    <section id="view-server" class="view" aria-labelledby="server-title" hidden>
                        <header class="page-head">
                            <h1 id="server-title" class="page-title">分布式服务器</h1>
                        </header>
                        <div class="plugin-group">
                            <div class="plugin-list">
                                <article class="plugins-card">
                                    <div class="plugins-card-header">
                                        <span class="plugins-card-copy">
                                            <strong class="plugins-card-title">启用分布式服务器</strong>
                                            <span id="distributed-server-status" class="plugins-card-description">读取中...</span>
                                        </span>
                                        <div class="plugins-card-tools">
                                            <button type="button" id="save-server-toggle-btn" class="plugins-button">保存开关</button>
                                            <label class="switch-container">
                                                <input type="checkbox" id="distributed-server-toggle" role="switch" aria-label="启用分布式服务器">
                                                <span class="switch-slider" aria-hidden="true"></span>
                                            </label>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </section>
    </div>

    <div id="plugin-modal" class="modal-overlay">
        <div class="modal-content plugin-modal-content" role="dialog" aria-modal="true" aria-labelledby="plugin-modal-title">
            <div class="modal-header">
                <div>
                    <h3 id="plugin-modal-title">编辑插件</h3>
                    <p id="plugin-modal-subtitle" class="modal-subtitle"></p>
                </div>
                <button class="modal-close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-tabs plugins-tabs" role="tablist">
                <button class="modal-tab plugins-tab active" data-target="manifest-panel" role="tab">Manifest</button>
                <button class="modal-tab plugins-tab" data-target="commands-panel" role="tab">Invocation Commands</button>
                <button class="modal-tab plugins-tab" data-target="env-panel" role="tab">config.env</button>
            </div>
            <div class="modal-body">
                <section id="manifest-panel" class="modal-panel active">
                    <div class="panel-note">直接编辑完整 Manifest JSON。保存前会进行 JSON 语法校验。</div>
                    <textarea id="manifest-editor" class="code-editor" spellcheck="false"></textarea>
                </section>
                <section id="commands-panel" class="modal-panel">
                    <div class="panel-note">这里专门管理 <code>capabilities.invocationCommands[].description</code> 字段；修改会同步回 Manifest JSON。</div>
                    <div id="commands-editor-list" class="commands-editor-list"></div>
                </section>
                <section id="env-panel" class="modal-panel">
                    <div class="panel-note">编辑插件目录下的 <code>config.env</code>。若文件不存在，保存时将自动创建。</div>
                    <textarea id="env-editor" class="code-editor env-editor" spellcheck="false"></textarea>
                </section>
            </div>
            <div class="modal-footer">
                <div class="modal-left-actions">
                    <button id="toggle-plugin-btn" class="plugins-button">切换启用状态</button>
                    <button id="open-plugin-folder-btn" class="plugins-button">打开目录</button>
                </div>
                <div class="modal-right-actions">
                    <button id="save-env-btn" class="plugins-button">保存 config.env</button>
                    <button id="save-manifest-btn" class="plugins-button plugins-button-primary">保存 Manifest</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="plugin-manager.js"></script>
</body>
</html>
