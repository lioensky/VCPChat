<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>桌面歌词</title>
    <link rel="stylesheet" href="desktop-lyrics.css">
</head>
<body>
    <div class="dl-bar" id="bar">
        <div class="dl-tools" id="tools" role="toolbar" aria-label="桌面歌词">
            <button type="button" data-cmd="previous" title="上一首" aria-label="上一首">
                <svg viewBox="0 0 24 24"><path d="M6 5v14M19 6l-9 6 9 6z"/></svg>
            </button>
            <button type="button" data-cmd="toggle" id="play" title="播放" aria-label="播放">
                <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5l11 7-11 7z"/></svg>
                <svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14"/></svg>
            </button>
            <button type="button" data-cmd="next" title="下一首" aria-label="下一首">
                <svg viewBox="0 0 24 24"><path d="M18 5v14M5 6l9 6-9 6z"/></svg>
            </button>
            <i class="dl-sep"></i>
            <button type="button" class="dl-size-btn" data-cmd="smaller" title="字小一点" aria-label="字小一点"><b>A</b><small>−</small></button>
            <button type="button" class="dl-size-btn" data-cmd="bigger" title="字大一点" aria-label="字大一点"><b>A</b><small>+</small></button>
            <i class="dl-sep"></i>
            <button type="button" data-cmd="open-music" title="打开播放器" aria-label="打开播放器">
                <svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
            </button>
            <button type="button" data-cmd="close" title="关闭桌面歌词" aria-label="关闭桌面歌词">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <button type="button" class="dl-lock" id="lock" data-cmd="lock" title="锁定：鼠标穿过歌词，点不到它" aria-label="锁定">
            <svg viewBox="0 0 24 24" class="i-unlocked"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>
            <svg viewBox="0 0 24 24" class="i-locked"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
        <div class="dl-lines" id="lines" aria-live="polite">
            <p class="dl-cur" id="cur"></p>
            <p class="dl-next" id="next"></p>
        </div>
    </div>
    <script src="desktop-lyrics.js"></script>
</body>
</html>
