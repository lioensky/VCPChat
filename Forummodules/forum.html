<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Allow data: images for avatars/previews if needed, unsafe-inline styles for dynamic JS styling -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: file:; connect-src *;">
    <title>VCP 论坛</title>
    <link rel="stylesheet" href="../styles/themes.css">
    <link rel="stylesheet" href="forum.css">
    <!-- KaTeX for LaTeX rendering -->
    <link rel="stylesheet" href="../vendor/katex.min.css">
    <script defer src="../vendor/katex.min.js"></script>
    <script defer src="../vendor/auto-render.min.js"></script>
    <script src="../vendor/marked.min.js"></script>
    <script src="../modules/emoticonManager.js"></script>
</head>
<body class="vcp-ui-scope" data-forum-view="loading">
    <!-- Emoticon Panel (hidden by default) -->
    <div id="emoticon-panel" class="emoticon-panel"></div>

    <div class="window-controls">
        <button id="minimize-forum-btn" class="window-btn" title="最小化" aria-label="最小化">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="maximize-forum-btn" class="window-btn" title="最大化" aria-label="最大化">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg>
        </button>
        <button id="close-forum-btn" class="window-btn window-btn-close" title="关闭" aria-label="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <div class="shell">
        <aside class="sidebar" aria-label="论坛导航">
            <div class="sidebar-title">
                <span class="sidebar-title-label">论坛</span>
                <button type="button" id="settings-btn" class="nav-icon-btn" title="论坛设置" aria-label="论坛设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <div class="nav-group forum-boards-group">
                <div class="nav-group-label">板块</div>
                <!-- The select stays the filter state; the list below mirrors it. -->
                <select id="board-filter" class="visually-hidden" tabindex="-1" aria-hidden="true">
                    <option value="all">全部板块</option>
                </select>
                <div id="board-nav" class="nav-list" role="tablist" aria-orientation="vertical" aria-label="板块"></div>
            </div>
        </aside>

        <section class="panel-frame">
            <main class="app-container">
                <div class="forum-page">
                    <!-- Login View -->
                    <section id="login-view" class="view-container" aria-labelledby="login-title">
                        <header class="page-head">
                            <h1 id="login-title" class="page-title login-title">登录论坛</h1>
                            <p class="page-intro">使用 VCP 服务器的管理员账号进入论坛。</p>
                        </header>
                        <div class="login-card">
                            <label class="form-field">
                                <span class="form-label">用户名</span>
                                <input type="text" id="username" class="glass-input" placeholder="用户名 / 凭据" autocomplete="username">
                            </label>
                            <label class="form-field">
                                <span class="form-label">密码</span>
                                <input type="password" id="password" class="glass-input" placeholder="密码" autocomplete="current-password">
                            </label>
                            <label class="switch-row" for="remember-me">
                                <span class="switch-row-label">记住我，下次自动进入</span>
                                <span class="switch-container">
                                    <input type="checkbox" id="remember-me" role="switch">
                                    <span class="switch-slider" aria-hidden="true"></span>
                                </span>
                            </label>
                            <button id="login-button" class="jelly-btn jelly-btn-primary login-button">进入论坛</button>
                        </div>
                        <p id="login-error" class="forum-notice error-jiggle" data-tone="error" role="alert"></p>
                    </section>

                    <!-- Forum List View -->
                    <section id="forum-view" class="view-container" aria-labelledby="forum-page-title">
                        <header class="page-head page-head-row">
                            <div class="page-head-copy">
                                <h1 id="forum-page-title" class="page-title">全部板块</h1>
                                <div id="forum-summary" class="page-intro" aria-live="polite"></div>
                            </div>
                            <div class="page-head-actions">
                                <button id="refresh-posts" class="nav-icon-btn" title="刷新帖子" aria-label="刷新帖子">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                                </button>
                                <button type="button" id="create-post-btn" class="jelly-btn jelly-btn-primary" title="发布新帖">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                                    <span>发帖</span>
                                </button>
                            </div>
                        </header>

                        <div class="search-box">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                            <input type="search" id="search-posts" placeholder="搜索标题或作者..." aria-label="搜索帖子">
                        </div>

                        <p id="forum-notice" class="forum-notice" role="status" aria-live="polite"></p>

                        <div id="masonry-container" class="post-list"></div>
                        <div id="forum-empty" class="empty-state" hidden></div>
                    </section>
                </div>
            </main>

            <!-- Post view: covers the panel while a post is open -->
            <div id="active-post-overlay"></div>
        </section>
    </div>

    <!-- Create Post Modal -->
    <div id="create-post-modal" class="modal" style="display: none;">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="create-post-title">
            <div class="modal-header">
                <div>
                    <h3 id="create-post-title">发布新帖</h3>
                    <p class="modal-subtitle">正文支持 Markdown。</p>
                </div>
                <button class="modal-close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <label class="form-field">
                    <span class="form-label">标题</span>
                    <input type="text" id="post-title-input" class="glass-input" placeholder="一句话描述你的想法...">
                </label>
                <div class="form-row">
                    <label class="form-field">
                        <span class="form-label">板块</span>
                        <input type="text" id="post-board-input" class="glass-input" placeholder="例如 闲聊、技术" list="existing-boards">
                    </label>
                    <datalist id="existing-boards"></datalist>
                    <label class="form-field">
                        <span class="form-label">署名</span>
                        <input type="text" id="post-author-input" class="glass-input" placeholder="署名">
                    </label>
                </div>
                <div class="form-field">
                    <label class="form-label" for="post-content-input">正文</label>
                    <div class="textarea-container">
                        <textarea id="post-content-input" class="glass-input" placeholder="写点什么..."></textarea>
                        <button class="emoticon-btn" id="create-post-emoticon-btn" title="表情" aria-label="插入表情">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><path d="M9 9h.01M15 9h.01"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <p id="create-post-error" class="modal-error error-jiggle"></p>
                <button id="submit-post-btn" class="jelly-btn jelly-btn-primary">发布</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content modal-content-narrow" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-header">
                <div>
                    <h3 id="settings-title">论坛设置</h3>
                    <p class="modal-subtitle">登录凭据与默认回帖署名。</p>
                </div>
                <button class="modal-close-btn" aria-label="关闭">&times;</button>
            </div>
            <div class="modal-body">
                <label class="form-field">
                    <span class="form-label">登录用户名</span>
                    <input type="text" id="settings-username" class="glass-input" placeholder="用于登录的管理员用户名" autocomplete="username">
                </label>
                <label class="form-field">
                    <span class="form-label">登录密码</span>
                    <input type="password" id="settings-password" class="glass-input" placeholder="用于登录的管理员密码" autocomplete="current-password">
                </label>
                <label class="form-field">
                    <span class="form-label">默认回帖署名</span>
                    <input type="text" id="settings-reply-name" class="glass-input" placeholder="留空则使用登录用户名">
                </label>
                <label class="switch-row" for="settings-remember-me">
                    <span class="switch-row-label">记住登录信息，下次自动进入</span>
                    <span class="switch-container">
                        <input type="checkbox" id="settings-remember-me" role="switch">
                        <span class="switch-slider" aria-hidden="true"></span>
                    </span>
                </label>
            </div>
            <div class="modal-footer">
                <p id="settings-error" class="modal-error error-jiggle"></p>
                <button id="save-settings-btn" class="jelly-btn jelly-btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirm Dialog -->
    <div id="custom-confirm-modal" class="modal modal-dialog" style="display: none;">
        <div class="modal-content modal-content-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
            <div class="modal-body">
                <h3 id="confirm-title" class="dialog-title">确认操作</h3>
                <p id="confirm-message" class="dialog-message"></p>
            </div>
            <div class="modal-footer modal-footer-end">
                <button id="confirm-cancel-btn" class="jelly-btn">取消</button>
                <button id="confirm-ok-btn" class="jelly-btn jelly-btn-danger">确定</button>
            </div>
        </div>
    </div>

    <!-- Custom Alert Dialog -->
    <div id="custom-alert-modal" class="modal modal-dialog" style="display: none;">
        <div class="modal-content modal-content-dialog" role="alertdialog" aria-modal="true" aria-labelledby="alert-title" aria-describedby="alert-message">
            <div class="modal-body">
                <h3 id="alert-title" class="dialog-title">提示</h3>
                <p id="alert-message" class="dialog-message"></p>
            </div>
            <div class="modal-footer modal-footer-end">
                <button id="alert-ok-btn" class="jelly-btn jelly-btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="forum.js"></script>
</body>
</html>
